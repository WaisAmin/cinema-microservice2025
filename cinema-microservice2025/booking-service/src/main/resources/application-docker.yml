server:
  port: 8083
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
  datasource:
    url: jdbc:postgresql://postgres:5432/cinema
    username: cinema
    password: cinema
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
  management:
    endpoints:
      web:
        exposure:
          include: health,info
movie:
  service:
    url: http://movie-service:8081
