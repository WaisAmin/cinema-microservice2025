server:
  port: 8083
spring:
  application:
    name: booking-service
  rabbitmq:
    host: localhost
    port: 5672

  datasource:
        url: jdbc:postgresql://localhost:5432/cinema
        username: cinema
        password: cinema
        driver-class-name: org.postgresql.Driver

  jpa:
        hibernate:
          ddl-auto: update
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
