server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/users/**

        - id: movie-service
          uri: http://movie-service:8082
          predicates:
            - Path=/movies/**

        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/bookings/**

        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/payments/**

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
