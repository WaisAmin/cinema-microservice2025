<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema</title>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #11151f;
        --muted: #6b7280;
        --text: #e5e7eb;
        --primary: #7c3aed;
        --primary-600: #6d28d9;
        --ring: rgba(124, 58, 237, 0.35);
        --ok: #10b981;
        --danger: #ef4444;
        --card: #0f1320;
        --border: #1f2937;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 800px at 10% -10%, #111827 0%, var(--bg) 40%), var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .nav {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 24px; position: sticky; top: 0; z-index: 10;
        backdrop-filter: blur(8px);
        background: linear-gradient(180deg, rgba(17,24,39,.8) 0%, rgba(17,24,39,.3) 100%);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; letter-spacing: .3px; }
      .brand .logo {
        width: 28px; height: 28px; border-radius: 8px;
        background: linear-gradient(135deg, var(--primary) 0%, #22d3ee 100%);
        box-shadow: 0 0 0 4px rgba(124,58,237,.12), 0 8px 24px rgba(124,58,237,.35);
      }
      .actions { display: flex; align-items: center; gap: 12px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
        background: linear-gradient(180deg, #0b0f1a 0%, #0a0e19 100%);
        color: var(--text); cursor: pointer; transition: all .2s ease;
      }
      .btn:hover { transform: translateY(-1px); border-color: #334155; }
      .btn.primary { background: linear-gradient(180deg, var(--primary) 0%, var(--primary-600) 100%); border-color: transparent; }
      .btn.primary:hover { filter: brightness(1.05); }
      .grid {
        margin-top: 24px;
        display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px;
      }
      .card {
        grid-column: span 4 / span 4;
        background: linear-gradient(180deg, var(--card) 0%, #0c1120 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,.45); }
      .card h3 { margin: 0 0 8px; font-size: 18px; }
      .card p { margin: 0; color: var(--muted); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }
      .input {
        width: 100%; padding: 10px 12px; border-radius: 10px; background: #0b1020;
        border: 1px solid var(--border); color: var(--text); outline: none;
      }
      .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
      .label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .row { display:flex; gap: 12px; }
      .grow { flex:1; }
      .muted { color: var(--muted); }
      .pill { font-size: 12px; padding: 4px 8px; border-radius: 999px; border:1px solid var(--border); background:#0b1020; }
      .toast { 
        position: fixed; right: 18px; bottom: 18px; padding: 12px 14px; border-radius: 12px; 
        background: #0b1020; border: 1px solid var(--border); z-index: 1000;
        box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: slideIn 0.3s ease;
      }
      .description { 
        font-size: 14px; line-height: 1.4; margin: 8px 0; 
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; 
        overflow: hidden; text-overflow: ellipsis;
      }
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card { animation: fadeIn 0.5s ease; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
      .btn:disabled:hover { transform: none !important; }
      @media (max-width: 900px) { .card { grid-column: span 6 / span 6; } }
      @media (max-width: 640px) { .card { grid-column: span 12 / span 12; } .row{flex-direction:column;} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
